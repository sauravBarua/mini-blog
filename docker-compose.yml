services:
  db:
    image: postgres:17-alpine
    container_name: mini-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d blog']
      interval: 5s
      timeout: 3s
      retries: 10

  # The services below only start with: docker compose --profile app up -d --build
  migrate:
    profiles: [app]
    build:
      context: ./backend
      target: build
    command: pnpm exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://blog:blog@db:5432/blog
    depends_on:
      db:
        condition: service_healthy

  backend:
    profiles: [app]
    build:
      context: ./backend
      target: runtime
    container_name: mini-blog-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://blog:blog@db:5432/blog
      JWT_SECRET: ${JWT_SECRET:-}
      # Local testing only: lets the production build set cookies over plain http://localhost.
      COOKIE_SECURE: 'false'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      target: runtime
      args:
        API_URL: http://backend:3000
    container_name: mini-blog-frontend
    restart: unless-stopped
    ports:
      - '3001:3001'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
